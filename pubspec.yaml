name: flutter_easy_sdk
description: Flutter SDK with common components for mobile projects
version: 0.0.2
homepage: https://github.com/olinyavod/flutter_easy_sdk

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter

  # Camera
  camerawesome: ^2.1.0

  # State management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # Utils
  path_provider: ^2.1.0

  # Image caching
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
